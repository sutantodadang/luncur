name: gitea
title: Gitea
description: Self-hosted Git service with issues, pull requests and CI.
category: developer
app:
  image: gitea/gitea:1.27.3
  port: 3000
  health_path: /api/healthz
volumes:
  - {name: data, path: /data, size_gb: 5}
addons:
  - {key: db, type: postgres}
env:
  GITEA__database__DB_TYPE: postgres
  GITEA__database__HOST: ${addon.db.host}:${addon.db.port}
  GITEA__database__NAME: ${addon.db.database}
  GITEA__database__USER: ${addon.db.user}
  GITEA__database__PASSWD: ${addon.db.password}
  GITEA__server__ROOT_URL: ${app.url}/
  GITEA__server__HTTP_PORT: "3000"
  GITEA__security__SECRET_KEY: ${random:64}
