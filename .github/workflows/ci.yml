name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The server package dwarfs every other package combined, so the race run
  # is sharded: wall-clock becomes max(shard) instead of sum. Build+vet ride
  # the "rest" shard (test builds everything anyway; vet is cheap).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [server, rest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        if: matrix.shard == 'rest'
        run: go build ./...

      - name: Vet
        if: matrix.shard == 'rest'
        run: go vet ./...

      - name: Test (server)
        if: matrix.shard == 'server'
        run: go test -race ./internal/server/

      - name: Test (rest)
        if: matrix.shard == 'rest'
        run: go test -race $(go list ./... | grep -v internal/server)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: E2E
        run: go test -tags e2e ./e2e -v -timeout 10m
        env:
          KUBECONFIG: /home/runner/.kube/config
